[package]
name = "dive-rs"
version = "0.1.0"
edition = "2021"
description = "Extract dive logs from dive computers via BLE"

[dependencies]
anyhow = "1"
btleplug = "0.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = "1"
blit = { git = "https://github.com/nicoburniske/blit", rev = "d607d7ec8f7cd2fe2785a7837a32f7495844d34c" }
blit-tui = { git = "https://github.com/nicoburniske/blit", rev = "d607d7ec8f7cd2fe2785a7837a32f7495844d34c" }
